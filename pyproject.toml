[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentinai"
version = "0.1.0.dev0"
description = "Python SDK for sending errors and logs to SentinAI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ebenezer" }]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Ebencode-x/sentinai-python"
Issues = "https://github.com/Ebencode-x/sentinai-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
